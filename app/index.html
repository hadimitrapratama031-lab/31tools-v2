<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Nova Launcher</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ── CUSTOM TITLE BAR ── -->
  <div class="titlebar">
    <div class="titlebar-drag">
      <div class="titlebar-logo"></div>
      <span id="titlebarAppName">Nova Launcher</span>
    </div>
    <div class="titlebar-controls">
      <button id="btnMinimize" title="Minimize">─</button>
      <button id="btnClose" title="Close">✕</button>
    </div>
  </div>

  <div class="bg-orbs"><span></span><span></span><span></span></div>

  <!-- ── LOGIN VIEW ── -->
  <div class="view" id="viewLogin">
    <div class="login-card">
      <div class="login-mark"></div>
      <h1 id="loginAppName">Nova Launcher</h1>
      <p>Masuk pakai akun Discord kamu buat lanjut. Pastikan kamu udah join server Discord kami dulu ya.</p>
      <button class="btn-discord" id="btnLoginDiscord">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M20.317 4.37a19.79 19.79 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028c.462-.63.874-1.295 1.226-1.994a.076.076 0 0 0-.041-.106 13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128c.126-.094.252-.192.372-.291a.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.099.246.198.373.292a.077.077 0 0 1-.006.127 12.3 12.3 0 0 1-1.873.892.076.076 0 0 0-.04.107c.36.698.772 1.362 1.225 1.993a.077.077 0 0 0 .084.028 19.84 19.84 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.06.06 0 0 0-.031-.03zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.157 2.418z"/></svg>
        Login dengan Discord
      </button>
      <div class="login-status" id="loginStatus"></div>
    </div>
  </div>

  <!-- ── APP VIEW (setelah login) ── -->
  <div class="view" id="viewApp" style="display:none;">
    <aside class="sidebar">
      <div class="sidebar-top">
        <div class="brand-mark"></div>
        <nav class="nav">
          <button class="nav-item active" data-page="game">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="6" width="20" height="12" rx="3"/><path d="M6 12h4M8 10v4M15 13h.01M18 11h.01"/></svg>
            Game
          </button>
          <button class="nav-item" data-page="bypass">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2 3 6v6c0 5 3.8 8.7 9 10 5.2-1.3 9-5 9-10V6l-9-4z"/></svg>
            Bypass
          </button>
          <button class="nav-item" data-page="histori">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>
            Histori
          </button>
        </nav>
      </div>
      <div class="sidebar-bottom">
        <div class="profile-card">
          <img id="profileAvatar" class="profile-avatar" src="" alt="">
          <div class="profile-info">
            <div class="profile-name" id="profileName">—</div>
            <span class="role-badge" id="profileRole">public</span>
          </div>
        </div>
        <button class="btn-logout" id="btnLogout">Keluar</button>
      </div>
    </aside>

    <main class="main">
      <header class="main-header">
        <h2 id="pageTitle">Game</h2>
        <p id="pageSubtitle">Daftar game yang bisa kamu install sesuai paket kamu.</p>
      </header>

      <section class="page active" id="pageGame">
        <div class="grid" id="gameGrid"></div>
      </section>

      <section class="page" id="pageBypass">
        <div class="grid" id="bypassGrid"></div>
      </section>

      <section class="page" id="pageHistori">
        <div class="history-list" id="historiList"></div>
      </section>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
